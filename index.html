<style>
:root {
  color-scheme: light;
  --paper: #EEF3F1;
  --paper-2: #E1EAE6;
  --ink: #16323F;
  --ink-soft: #4B6470;
  --rule: #C3D4CC;
  --contour: #A9C6BA;
  --contour-index: #6C998B;
  --water: #1F6E8C;
  --water-ink: #FFFFFF;
  --mark: #E9B44C;
  --font: "Archivo", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --paper: #0F1F25;
    --paper-2: #162B32;
    --ink: #E4EEEA;
    --ink-soft: #A3B8BB;
    --rule: #284440;
    --contour: #26473F;
    --contour-index: #3F7265;
    --water: #7CC0DC;
    --water-ink: #0F1F25;
  }
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font);
  font-size: 1.0625rem;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; display: block; }
a { color: var(--water); text-underline-offset: 0.18em; }
:focus-visible { outline: 3px solid var(--mark); outline-offset: 3px; }

.wrap { max-width: 72rem; margin: 0 auto; padding: 0 clamp(1.25rem, 4vw, 2.5rem); }

/* Header */
.site-header {
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
  gap: 0.5rem 1.5rem;
  padding: 0.9rem clamp(1.25rem, 4vw, 2.5rem);
  border-bottom: 1px solid var(--rule);
}
.brand {
  display: inline-flex; align-items: center; gap: 0.5rem;
  color: var(--ink); text-decoration: none;
  font-weight: 800; font-stretch: 125%; font-size: 1.125rem; letter-spacing: -0.01em;
}
.site-nav { display: flex; gap: 1.25rem; }
.site-nav a { color: var(--ink); text-decoration: none; font-size: 0.95rem; }
.site-nav a:hover { text-decoration: underline; }

/* Triangulation point symbol */
.trig { width: 22px; height: 20px; flex: none; overflow: visible; }
.trig path { fill: var(--paper); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
.trig circle { fill: var(--ink); }
.trig.small { width: 16px; height: 15px; }

/* Hero map */
.hero { position: relative; }
.map {
  position: relative; overflow: hidden;
  height: 86vh; height: min(86svh, 52rem); min-height: 34rem;
}
.terrain { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.terrain path { fill: none; stroke-linecap: round; }
.terrain .c { stroke: var(--contour); stroke-width: 1; }
.terrain .ci { stroke: var(--contour-index); stroke-width: 1.5; }
.terrain .network { stroke: var(--ink); stroke-width: 1.25; stroke-dasharray: 2 6; opacity: 0.55; }
.neatline {
  position: absolute; inset: clamp(0.6rem, 1.5vw, 1.25rem);
  border: 1px solid var(--ink); opacity: 0.3; pointer-events: none;
}
.stations { position: absolute; inset: 0; pointer-events: none; }
.station {
  position: absolute; pointer-events: auto;
  display: flex; align-items: center; gap: 0.45rem;
  color: var(--ink); text-decoration: none;
  transform: translate(-11px, -50%);
}
.station.flip { flex-direction: row-reverse; transform: translate(calc(-100% + 11px), -50%); text-align: right; }
.station-label {
  display: flex; flex-direction: column; line-height: 1.15;
  font-stretch: 75%; white-space: nowrap;
  text-shadow:
    1px 1px 0 var(--paper), -1px -1px 0 var(--paper), 1px -1px 0 var(--paper), -1px 1px 0 var(--paper),
    0 0 4px var(--paper), 0 0 8px var(--paper);
}
.station-name { font-weight: 700; font-size: 1.1rem; }
.station-role { font-size: 0.88rem; color: var(--ink-soft); }
.station.wrap .station-label { white-space: normal; }
.station:hover .station-name { text-decoration: underline; }
.station:hover .trig path, .station:focus-visible .trig path { fill: var(--mark); }

.title-block {
  position: absolute;
  left: clamp(1.5rem, 5vw, 4rem); bottom: clamp(1.5rem, 5vw, 4rem);
  max-width: 30rem;
  background: var(--paper);
  border: 1.5px solid var(--ink);
  padding: 1.75rem 2rem 1.5rem;
}
.title-block h1 {
  margin: 0 0 0.75rem;
  font-stretch: 125%; font-weight: 800;
  font-size: clamp(2.4rem, 5.2vw, 4rem); line-height: 1; letter-spacing: -0.02em;
}
.lede { margin: 0 0 0.75rem; font-size: 1.1rem; }
.record { margin: 0 0 1.5rem; color: var(--ink-soft); }
.actions { display: flex; flex-wrap: wrap; gap: 0.75rem; }
.btn {
  display: inline-flex; align-items: center;
  padding: 0.7rem 1.1rem;
  font: inherit; font-weight: 600; font-size: 1rem;
  border: 1.5px solid var(--water); border-radius: 2px;
  text-decoration: none; cursor: pointer;
}
.btn-primary { background: var(--water); color: var(--water-ink); }
.btn-secondary { background: transparent; color: var(--water); }
.btn:hover { filter: brightness(1.08); }
.legend {
  display: flex; align-items: center; gap: 0.6rem;
  margin: 1.5rem 0 0; padding-top: 1rem;
  border-top: 1px solid var(--rule);
  font-size: 0.9rem; color: var(--ink-soft);
}

/* One orchestrated entrance: the terrain rises level by level, then the trainers appear */
.map.is-animating .terrain path { opacity: 0; animation: appear 0.8s ease-out forwards; animation-delay: calc(var(--i) * 45ms); }
.map.is-animating .terrain .network { animation-delay: 1000ms; }
.map.is-animating .station { opacity: 0; animation: appear 0.5s ease-out forwards; animation-delay: var(--d); }
@keyframes appear { to { opacity: 1; } }

@media (max-width: 999px) {
  .map { height: 60vh; height: 60svh; min-height: 22rem; max-height: 34rem; }
  .title-block {
    position: static; max-width: none;
    border-width: 1.5px 0; padding: 2rem clamp(1.25rem, 4vw, 2.5rem);
  }
  .title-block > * { max-width: 36rem; }
}
@media (max-width: 480px) {
  .station-role { display: none; }
  .station-name { font-size: 1rem; }
}

/* Sections */
.section { padding: clamp(4rem, 9vw, 7rem) 0; }
.section + .section { border-top: 1px solid var(--rule); }
.section-head { max-width: 40rem; margin-bottom: clamp(2rem, 4vw, 3rem); }
.section-head h2 {
  margin: 0 0 0.75rem;
  font-stretch: 125%; font-weight: 800;
  font-size: clamp(1.9rem, 3.6vw, 2.75rem); line-height: 1.05; letter-spacing: -0.015em;
}
.section-head p { margin: 0; font-size: 1.125rem; color: var(--ink-soft); }

/* Trainers */
.trainers { display: grid; grid-template-columns: repeat(3, 1fr); }
.trainer {
  padding: 0 clamp(1.25rem, 2.5vw, 2.25rem);
  border-left: 1px solid var(--rule);
  scroll-margin-top: 1.5rem;
}
.trainer:first-child { padding-left: 0; border-left: 0; }
.trainer:last-child { padding-right: 0; }
.photo {
  width: 100%; max-width: 14rem; aspect-ratio: 4 / 5; object-fit: cover;
  border: 1.5px solid var(--ink); background: var(--paper-2);
  margin-bottom: 1.25rem;
}
.photo.initials {
  display: grid; place-items: center;
  font-stretch: 125%; font-weight: 800; font-size: 3rem; color: var(--ink-soft);
}
.trainer-name {
  margin: 0;
  font-stretch: 125%; font-weight: 700; font-size: 1.35rem; line-height: 1.2;
}
.trainer-name .trig { margin-right: 0.4rem; vertical-align: -1px; }
.trainer-name .hl {
  background-image: linear-gradient(var(--mark), var(--mark));
  background-repeat: no-repeat; background-position: 0 90%; background-size: 0 0.35em;
}
.trainer:target .trainer-name .hl { background-size: 100% 0.35em; transition: background-size 0.6s ease-out 0.3s; }
.trainer-role { margin: 0.3rem 0 1rem; color: var(--water); font-weight: 600; }
.trainer-bio { margin: 0 0 1rem; }
.trainer-teaches { margin: 0 0 1.1rem; font-size: 0.95rem; color: var(--ink-soft); }
.trainer-links { display: flex; flex-wrap: wrap; gap: 0.4rem 1.1rem; font-weight: 600; font-size: 0.95rem; }

@media (max-width: 899px) {
  .trainers { grid-template-columns: 1fr; }
  .trainer, .trainer:first-child, .trainer:last-child { padding: 2.25rem 0; border-left: 0; border-top: 1px solid var(--rule); }
  .trainer:first-child { padding-top: 0; border-top: 0; }
  .trainer { display: grid; grid-template-columns: minmax(7rem, 11rem) 1fr; gap: 0 1.5rem; align-items: start; }

}
@media (max-width: 520px) {
  .trainer { grid-template-columns: 1fr; }
  .photo { max-width: 10rem; margin-bottom: 1.25rem; }

/* Trainings */
.filters { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 1.25rem 2.5rem; margin-bottom: 1.25rem; }
.search label, .topics legend { display: block; font-weight: 600; font-size: 0.95rem; margin-bottom: 0.4rem; padding: 0; }
.search input {
  width: min(22rem, 100%);
  padding: 0.6rem 0.8rem;
  font: inherit; color: var(--ink); background: var(--paper);
  border: 1.5px solid var(--ink-soft); border-radius: 2px;
}
.search input:focus-visible { outline-offset: 1px; }
.topics { border: 0; margin: 0; padding: 0; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.chip {

}
.chip:hover { border-color: var(--ink-soft); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.result-count { margin: 0 0 2rem; font-size: 0.95rem; color: var(--ink-soft); }

.year {
  display: grid; grid-template-columns: 8rem 1fr; gap: 2rem;
  padding: 1.5rem 0 2rem;

}
.year h3 {
  position: sticky; top: 1.5rem; align-self: start;
  margin: 0;
  font-stretch: 125%; font-weight: 800; font-size: 2rem; line-height: 1;
  font-variant-numeric: tabular-nums;
}
.rows { list-style: none; margin: 0; padding: 0; }
.row {
  display: grid; grid-template-columns: 1fr 12rem; gap: 0.4rem 1.5rem;
  padding: 1.1rem 0;
  border-top: 1px solid var(--rule);
}
.row:first-child { padding-top: 0.1rem; border-top: 0; }
.row-title { margin: 0; font-size: 1.125rem; font-weight: 700; line-height: 1.3; }
.row-title a { color: inherit; }
.row-org { margin: 0.2rem 0 0; }
.row-topics { margin: 0.35rem 0 0; font-size: 0.9rem; color: var(--ink-soft); }
.row-meta {

}
.empty { padding: 2rem; border: 1.5px dashed var(--rule); }
.empty p { margin: 0 0 1rem; }

@media (max-width: 759px) {
  .year { grid-template-columns: 1fr; gap: 1rem; }
  .year h3 { position: static; }

/* Contact */
.contact { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 2rem; }

@media (max-width: 759px) { .contact { grid-template-columns: 1fr; } }

/* Footer */
.site-footer { border-top: 1px solid var(--rule); padding: 1.75rem 0; font-size: 0.9rem; color: var(--ink-soft); }
.site-footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.5rem 2rem; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .map.is-animating .terrain path, .map.is-animating .station { animation: none; opacity: 1; }

}
</style>
</head>

<script>
(() => {
  const $ = (s, el = document) => el.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const trigSVG = cls => `<svg class="trig ${cls || ""}" viewBox="0 0 24 22" aria-hidden="true"><path d="M12 2 22 20H2Z"/><circle cx="12" cy="14" r="2.4"/></svg>`;
  const list = items => {
    try { return new Intl.ListFormat("en", { style: "long", type: "conjunction" }).format(items); }
    catch { return items.join(", "); }
  };
  const byId = Object.fromEntries(TRAINERS.map(t => [t.id, t]));
  const shortName = id => byId[id]?.shortName || (byId[id]?.name || id).split(" ")[0];
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- Site text ---------- */
  document.title = `${SITE.name} | GIS training`;
  document.querySelectorAll("[data-site-name]").forEach(el => el.textContent = SITE.name);
  $("#lede").textContent = SITE.description;
  $("#trainers-intro").textContent = SITE.trainersIntro;
  $("#contact-text").textContent = SITE.contactText;
  $("#contact-btn").href = `mailto:${SITE.email}?subject=${encodeURIComponent("Training enquiry")}`;
  $("#contact-address").textContent = SITE.email;
  $("#copyright").textContent = `© ${new Date().getFullYear()} ${SITE.name}`;

  const sorted = TRAININGS.map((t, i) => ({ ...t, _i: i })).sort((a, b) => (Number(b.year) - Number(a.year)) || (b._i - a._i));
  if (sorted.length) {
    const since = Math.min(...TRAININGS.map(t => Number(t.year)));
    const people = TRAININGS.reduce((n, t) => n + (Number(t.participants) || 0), 0);
    const hours = TRAININGS.reduce((n, t) => n + (Number(t.hours) || 0), 0);
    const n = sorted.length;
    $("#record").textContent = `Since ${since} we’ve taught ${people} participants across ${n} training${n === 1 ? "" : "s"}` +
      (hours ? ` and ${hours} hours.` : ".");
  } else {
    $("#record").remove();
  }

  /* ---------- Trainers ---------- */
  $("#trainer-list").innerHTML = TRAINERS.map(t => {
    const parts = t.name.trim().split(/\s+/);
    const initials = (parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : "")).toUpperCase();
    const photo = t.photo
      ? `<img class="photo" src="${esc(t.photo)}" alt="Portrait of ${esc(t.name)}" loading="lazy">`
      : `<div class="photo initials" aria-hidden="true">${esc(initials)}</div>`;
    const links = [
      t.links?.email && `<a href="mailto:${esc(t.links.email)}">Email</a>`,
      t.links?.linkedin && `<a href="${esc(t.links.linkedin)}" target="_blank" rel="noopener">LinkedIn</a>`,
      t.links?.website && `<a href="${esc(t.links.website)}" target="_blank" rel="noopener">Website</a>`
    ].filter(Boolean).join("");
    return `
      <article class="trainer" id="trainer-${esc(t.id)}">
        ${photo}
        <div>
          <h3 class="trainer-name">${trigSVG("small")}<span class="hl">${esc(t.name)}</span></h3>
          <p class="trainer-role">${esc(t.role)}</p>
          <p class="trainer-bio">${esc(t.bio)}</p>
          ${t.teaches?.length ? `<p class="trainer-teaches">Teaches ${esc(list(t.teaches))}.</p>` : ""}
          ${links ? `<div class="trainer-links">${links}</div>` : ""}
        </div>
      </article>`;
  }).join("");

  /* ---------- Trainings ---------- */
  const topics = [...new Set(TRAININGS.flatMap(t => t.topics || []))].sort((a, b) => a.localeCompare(b));
  const state = { q: "", topic: null };

  const chips = $("#chips");
  chips.innerHTML = [`<button type="button" class="chip" data-topic="" aria-pressed="true">All topics</button>`]
    .concat(topics.map(t => `<button type="button" class="chip" data-topic="${esc(t)}" aria-pressed="false">${esc(t)}</button>`))
    .join("");
  chips.addEventListener("click", e => {
    const btn = e.target.closest(".chip");
    if (!btn) return;
    state.topic = btn.dataset.topic || null;
    chips.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(c === btn)));
    renderTrainings();
  });
  $("#q").addEventListener("input", e => { state.q = e.target.value.trim().toLowerCase(); renderTrainings(); });

  function matches(t) {
    if (state.topic && !(t.topics || []).includes(state.topic)) return false;
    if (!state.q) return true;
    const hay = [t.title, t.organization, t.location, t.format, ...(t.topics || []), ...(t.trainers || []).map(id => byId[id]?.name || id)]
      .join(" ").toLowerCase();
    return hay.includes(state.q);
  }

  function renderTrainings() {
    const shown = sorted.filter(matches);
    const total = sorted.length;
    $("#count").textContent = shown.length === total
      ? `${total} training${total === 1 ? "" : "s"}`
      : `Showing ${shown.length} of ${total} trainings`;

    const out = $("#training-list");
    if (!shown.length) {
      out.innerHTML = `
        <div class="empty">
          <p>No trainings match${state.q ? ` “${esc(state.q)}”` : ""}${state.topic ? ` in ${esc(state.topic)}` : ""}. Try another search or topic.</p>
          <button type="button" class="btn btn-secondary" id="clear">Clear filters</button>
        </div>`;
      $("#clear").addEventListener("click", () => {
        state.q = ""; state.topic = null; $("#q").value = "";
        chips.querySelectorAll(".chip").forEach((c, i) => c.setAttribute("aria-pressed", String(i === 0)));
        renderTrainings();
      });
      return;
    }

    const years = {};
    shown.forEach(t => (years[String(t.year)] ||= []).push(t));
    out.innerHTML = Object.keys(years).sort((a, b) => b - a).map(y => `
      <section class="year" aria-label="${y}">
        <h3>${y}</h3>
        <ul class="rows">
          ${years[y].map(t => {
            const title = t.link ? `<a href="${esc(t.link)}" target="_blank" rel="noopener">${esc(t.title)}</a>` : esc(t.title);
            const where = [t.organization, t.location !== t.format ? t.location : ""].filter(Boolean).join(", ");
            const team = (t.trainers || []).map(shortName);
            return `
              <li class="row">
                <div>
                  <h4 class="row-title">${title}</h4>
                  ${where ? `<p class="row-org">${esc(where)}</p>` : ""}
                  ${t.topics?.length ? `<p class="row-topics">${esc(t.topics.join(", "))}</p>` : ""}
                </div>
                <p class="row-meta">
                  ${t.format ? `<span>${esc(t.format)}</span>` : ""}
                  ${t.hours ? `<span>${esc(t.hours)} hours</span>` : ""}
                  ${t.participants ? `<span>${esc(t.participants)} participant${Number(t.participants) === 1 ? "" : "s"}</span>` : ""}
                  ${team.length ? `<span>With ${esc(list(team))}</span>` : ""}
                </p>
              </li>`;
          }).join("")}
        </ul>
      </section>`).join("");
  }
  renderTrainings();

  /* ---------- Contour map ---------- */
  const mapEl = $("#map"), svg = $("#terrain"), stationsEl = $("#stations");
  const LAYOUT = {
    wide:   [[0.58, 0.27], [0.85, 0.50], [0.66, 0.76]],
    narrow: [[0.26, 0.28], [0.74, 0.46], [0.40, 0.76]]
  };

  function makeNoise(seed) {
    const hash = (x, y) => {
      let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(seed, 982451653)) | 0;
      h = Math.imul(h ^ (h >>> 13), 1274126177);
      h ^= h >>> 16;
      return (h >>> 0) / 4294967296;
    };
    const fade = t => t * t * (3 - 2 * t);
    const noise = (x, y) => {
      const xi = Math.floor(x), yi = Math.floor(y);
      const u = fade(x - xi), v = fade(y - yi);
      const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
    return (x, y) => {
      let s = 0, amp = 0.5, f = 1;
      for (let o = 0; o < 4; o++) { s += amp * noise(x * f + o * 17.3, y * f - o * 9.1); f *= 2; amp *= 0.5; }
      return s / 0.9375;
    };
  }

  function makeTerrain(peaks, fbm) {
    return (x, y) => {
      let z = 0;
      for (const p of peaks) {
        const dx = x - p.x, dy = y - p.y;
        z += p.amp * Math.exp(-(dx * dx + dy * dy) / (2 * p.s * p.s));
      }
      return z + 0.6 * (fbm(x / 230, y / 230) - 0.5) + 0.1 * (fbm(x / 80 + 50, y / 80) - 0.5);
    };
  }

  // Marching squares: one SVG path per elevation level
  function contourPaths(f, w, h, cell, nLevels) {
    const cols = Math.ceil(w / cell) + 1, rows = Math.ceil(h / cell) + 1;
    const v = new Float32Array(cols * rows);
    let min = Infinity, max = -Infinity;
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
      const z = f(i * cell, j * cell);
      v[j * cols + i] = z;
      if (z < min) min = z;
      if (z > max) max = z;
    }
    const SEG = { 1: ["LB"], 2: ["BR"], 3: ["LR"], 4: ["TR"], 6: ["TB"], 7: ["TL"], 8: ["TL"], 9: ["TB"], 11: ["TR"], 12: ["LR"], 13: ["RB"], 14: ["LB"] };
    const step = (max - min) / (nLevels + 1);
    const paths = [];
    for (let k = 1; k <= nLevels; k++) {
      const l = min + step * k;
      let d = "";
      for (let j = 0; j < rows - 1; j++) {
        const y0 = j * cell;
        for (let i = 0; i < cols - 1; i++) {
          const tl = v[j * cols + i], tr = v[j * cols + i + 1], bl = v[(j + 1) * cols + i], br = v[(j + 1) * cols + i + 1];
          const idx = (tl >= l ? 8 : 0) | (tr >= l ? 4 : 0) | (br >= l ? 2 : 0) | (bl >= l ? 1 : 0);
          if (idx === 0 || idx === 15) continue;
          let segs = SEG[idx];
          if (idx === 5 || idx === 10) {
            const centerHigh = (tl + tr + bl + br) / 4 >= l;
            segs = (idx === 5) === centerHigh ? ["TL", "RB"] : ["TR", "LB"];
          }
          const x0 = i * cell;
          const pt = e => e === "T" ? [x0 + cell * (l - tl) / (tr - tl), y0]
            : e === "R" ? [x0 + cell, y0 + cell * (l - tr) / (br - tr)]
            : e === "B" ? [x0 + cell * (l - bl) / (br - bl), y0 + cell]
            : [x0, y0 + cell * (l - tl) / (bl - tl)];
          for (const s of segs) {
            const a = pt(s[0]), b = pt(s[1]);
            d += `M${a[0].toFixed(1)} ${a[1].toFixed(1)}L${b[0].toFixed(1)} ${b[1].toFixed(1)}`;
          }
        }
      }
      paths.push(d);
    }
    return paths;
  }

  let lastW = 0, lastH = 0;
  function drawMap(animate) {
    const w = mapEl.clientWidth, h = mapEl.clientHeight;
    if (!w || !h) return;
    lastW = w; lastH = h;
    const narrow = w < 1000;
    const pos = narrow ? LAYOUT.narrow : LAYOUT.wide;
    const R = Math.min(w, h);
    const sig = [0.17, 0.21, 0.15], amp = [1, 0.85, 0.95];
    const people = TRAINERS.slice(0, pos.length);
    const peaks = people.map((t, i) => ({ x: pos[i][0] * w, y: pos[i][1] * h, s: sig[i] * R * (narrow ? 1.1 : 1), amp: amp[i] }));
    const f = makeTerrain(peaks, makeNoise(Number(SITE.terrainSeed) || 1));
    const levels = contourPaths(f, w, h, narrow ? 6 : 8, 22);

    svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
    let markup = levels.map((d, k) => `<path class="${(k + 1) % 5 === 0 ? "ci" : "c"}" style="--i:${k}" d="${d}"/>`).join("");
    if (peaks.length > 1) {
      markup += `<path class="network" d="M${peaks.map(p => `${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join("L")}${peaks.length > 2 ? "Z" : ""}"/>`;
    }
    svg.innerHTML = markup;

    stationsEl.innerHTML = people.map((t, i) => {
      const p = peaks[i];
      return `
        <a class="station" href="#trainer-${esc(t.id)}" style="left:${p.x}px;top:${p.y}px;--d:${1050 + i * 140}ms">
          ${trigSVG()}
          <span class="station-label"><span class="station-name">${esc(t.name)}</span><span class="station-role">${esc(t.role)}</span></span>
        </a>`;
    }).join("");

    placeLabels();
    mapEl.classList.toggle("is-animating", Boolean(animate) && !reduceMotion);
  }

  // Put each label on whichever side of its triangle has room; wrap only if neither does
  function placeLabels() {
    const W = mapEl.clientWidth, edge = 18, offset = 18;
    stationsEl.querySelectorAll(".station").forEach(st => {
      const label = st.querySelector(".station-label");
      st.classList.remove("flip", "wrap");
      label.style.maxWidth = "";
      const x = parseFloat(st.style.left);
      const need = label.scrollWidth;
      const right = W - edge - x - offset, left = x - offset - edge;
      if (need <= right) return;
      if (need <= left) { st.classList.add("flip"); return; }
      if (left > right) st.classList.add("flip");
      st.classList.add("wrap");
      label.style.maxWidth = `${Math.max(left, right)}px`;
    });
  }
  if (document.fonts?.ready) document.fonts.ready.then(placeLabels);

  drawMap(true);
  let timer;
  new ResizeObserver(() => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      const w = mapEl.clientWidth, h = mapEl.clientHeight;
      if (w !== lastW || Math.abs(h - lastH) > 40) drawMap(false);
    }, 150);
  }).observe(mapEl);
})();
</script>
</body>
</html>
